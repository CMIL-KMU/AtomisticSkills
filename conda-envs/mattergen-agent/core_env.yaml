name: mattergen-agent
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - uv

  - pip:
    - mcp>=2.2,<3
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - --find-links https://data.pyg.org/whl/torch-2.2.1+cu118.html
    - mattergen

  # CRITICAL: PyG dependencies require manual installation from git source on ARM/aarch64
  # See README.md and docs/installing_torch_scatter_arm.md for detailed instructions
