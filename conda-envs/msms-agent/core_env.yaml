name: ms-gen
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - cython
  - matplotlib
  - conda-forge::python-graphviz
  - conda-forge::pygraphviz
  - pip
  - einops
  - seaborn
  - h5py
  - pip:
    - torch==2.4.0
    - mpmath<1.4
    - rdkit==2025.03.*
    - pytorch-lightning
    - "ray[tune]>=2.49.1"
    - "setuptools<81"
    - ipython
    - pydantic
    - scikit-learn
    - pathos
    - CairoSVG
    - omegaconf
    - pubchempy
    - pygmtools
    - msbuddy
    - lightgbm
    - platformdirs
    - pyyaml
