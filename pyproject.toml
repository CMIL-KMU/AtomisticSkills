[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atomistic-analysis"
version = "0.1.0"
description = "Reusable scientific analysis tools from AtomisticSkills"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
transport = ["pymatgen-analysis-diffusion==2025.11.15", "ase", "matplotlib", "PyYAML", "lovelyplots==1.0.2"]

visualization = ["pymatviz==0.18.0", "plotly==7.0.0", "kaleido==1.4.0", "lovelyplots==1.0.2"]

[project.scripts]
atomistic-diffusion = "atomistic_analysis.cli:diffusion_main"
atomistic-arrhenius = "atomistic_analysis.cli:arrhenius_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["atomistic_analysis*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
".agents/skills/**/scripts/*.py" = ["E402"]
".agents/skills/**/examples/**/*.py" = ["E402"]
"src/mcp_server/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
